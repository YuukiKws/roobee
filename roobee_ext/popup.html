<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 250px;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
    }
    .app-title {
      font-size: 14px;
      font-weight: bold;
      color: #e8730a;
      margin-bottom: 14px;
    }
    .section {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .label {
      font-size: 13px;
      color: #333;
    }
    .sub-note {
      margin-top: 6px;
      font-size: 11px;
      color: #999;
      line-height: 1.5;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.2s;
    }
    .slider::before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider {
      background-color: #e8730a;
    }
    input:checked + .slider::before {
      transform: translateX(20px);
    }
    .segmented {
      display: flex;
      border: 1px solid #e8730a;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }
    .segmented button {
      flex: 1;
      border: none;
      background: #fff;
      color: #e8730a;
      font-size: 12px;
      padding: 6px 0;
      cursor: pointer;
    }
    .segmented button.active {
      background: #e8730a;
      color: #fff;
    }
    label.checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
    }
    label.checkbox-row input {
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app-title">Roobee</div>

  <div class="section">
    <div class="row">
      <span class="label">ルビ表示</span>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="sub-note">On/Offを変更した場合はページをリロードしてください。</div>
  </div>

  <div class="section">
    <div class="label">ラベル表示</div>
    <div class="segmented">
      <button id="modeEn" class="active">英語</button>
      <button id="modeKana">カタカナ</button>
    </div>
    <div class="sub-note">即反映されます。</div>
  </div>

  <div class="section">
    <label class="checkbox-row">
      <input type="checkbox" id="excludeSuru" checked>
      <span>「名詞+する」の「する」は除外する(例: 説明する → 説明のみ表示)</span>
    </label>
    <div class="sub-note">この設定はページ再読み込み後に反映されます。</div>
  </div>

  <div class="section" style="border-bottom: none; padding-bottom: 0;">
    <button id="openOptions" style="width:100%; padding:8px; font-size:12px; border:1px solid #e8730a; background:#fff; color:#e8730a; border-radius:6px; cursor:pointer;">
      単語ごとの詳細設定を開く
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
